<style>
:root{--bg:#f4fbf6;--c:#fff;--t:#222;--m:#666;--p:#1b9e5a;--b:#ffd166;--no:#d62828;--l:#d6e8dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14201a;--c:#1f2e26;--t:#eef6f0;--m:#a8bbb0;--l:#37503f}}
:root[data-theme=dark]{--bg:#14201a;--c:#1f2e26;--t:#eef6f0;--m:#a8bbb0;--l:#37503f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.7 "PingFang SC","Microsoft YaHei",sans-serif}
header{padding:14px;text-align:center}h1{margin:0;font-size:21px}header p{margin:2px 0 0;color:var(--m);font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--l)}
nav button{flex:none;min-width:40px;border:2px solid var(--l);background:var(--c);color:var(--t);border-radius:20px;padding:5px 11px;font:inherit;font-size:14px}
nav button.on{background:var(--p);border-color:var(--p);color:#fff}
main{max-width:800px;margin:0 auto;padding:10px}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin:10px 0}
h2{margin:0 0 6px;font-size:19px;color:var(--p)}ul{margin:4px 0;padding-left:20px}
.q{border-top:1px dashed var(--l);padding:10px 0}.q label{display:block;padding:6px 10px;margin:4px 0;border:2px solid var(--l);border-radius:10px}
.fb{font-size:14px;color:var(--m)}.fb.ok{color:var(--p)}.fb.no{color:var(--no)}
.sub{background:var(--p);color:#fff;border:0;border-radius:12px;padding:10px 26px;font:inherit;font-weight:700;margin-top:8px}.sub:disabled{opacity:.5}
.sc{font-size:20px;font-weight:700;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}

["人类",["主要骨骼：头骨、脊柱、肋骨、手部骨骼、足部骨骼","头骨：保护大脑","脊柱：支撑身体，保护脊髓","肋骨：保护心脏和肺","骨骼的作用：支撑身体、保护内脏、使身体能够活动","血液循环系统：由心脏、血管和血液组成","心脏：推动血液在全身流动","血管：输送血液的管道","血液：运送氧气、养分和废物","肺部气体交换：血液吸收氧气，排出二氧化碳","含氧量高的血液：从肺流回心脏，再送到全身","含氧量低的血液：从身体各部分流回心脏，再送到肺","消化系统：把食物分解，让养分被血液吸收","呼吸系统：吸入氧气，呼出二氧化碳","排泄系统：排出身体的废物","各系统相互联系：消化、呼吸、血液循环和排泄系统互相配合","保持血液循环健康：多运动，不吸烟，均衡饮食","保持骨骼健康：多喝牛奶，多运动，保持正确姿势"],[]],
["动物",["物种生存：动物能够生存并繁衍后代","自卫：动物保护自己，免受敌人伤害","伪装：身体颜色与环境相似，如变色龙","硬壳：保护身体，如乌龟、蜗牛","硬刺：保护身体，如刺猬、豪猪","适应恶劣气候：改变习性或身体特征来度过寒冷或干旱","冬眠：寒冷时睡很久，减少能量消耗","迁徙：为了避寒或找食物而长途迁移，如燕子","保护卵：把卵藏起来或守护，如海龟把卵埋在沙里","照顾幼儿：喂养并保护幼儿，使它们存活","太阳：食物链能量的主要来源","生产者：能自己制造食物的绿色植物","消费者：靠吃其他生物获得养分","食物链：生物之间吃与被吃的关系，从生产者开始","食物网：多条食物链互相交织","草食动物：只吃植物的动物","肉食动物：只吃其他动物的动物","生态平衡：某种生物数量改变，会影响其他生物"],[]],
["植物",["植物的物种生存：植物能够生存并繁衍后代","自卫特征：尖刺、胶乳、细毛、毒素和臭味","尖刺：防止动物啃食，如仙人掌、玫瑰","胶乳：受伤时流出胶乳，如橡胶树","细毛：叶上有细毛刺痛动物，如荨麻","毒素：植物含有毒物质，动物吃了会不舒服","臭味：气味难闻，使动物不敢靠近","落叶：干旱时落叶以减少水分散失","储水茎：茎能储存水分，如仙人掌","蜡质茎：表面有蜡，减少水分蒸发","针状叶：叶子细小如针，减少水分蒸发，如松树","长根：根长得很深，吸收地下的水","种子传播：靠风力、水力、自动爆裂、人类或动物","风力传播：种子轻、有翅或绒毛，如蒲公英","水力传播：种子能浮在水上，如椰子","自动爆裂：果实成熟后爆开，如凤仙花","动物传播：种子带钩刺或果肉可食，靠动物带走","人类传播：人们种植植物，把种子带到别处"],[]],
["电",["电路：电流流动的完整路径","串联电路：电器连成一条路径","并联电路：电器分成几条路径","灯泡亮度比较：并联电路的灯泡比串联电路的灯泡亮","改变电池数量：电池越多，灯泡越亮","改变灯泡数量：串联电路中灯泡越多，每个灯泡越暗","开关：控制电路接通或断开","分支开关：并联电路中，开关可单独控制所在分支的灯泡","干电池：最常见的电源","蓄电池：可以重复充电的电池","小型发电机：转动时产生电，如脚踏车灯","太阳能电池：把光能转换成电能","发电站：大规模发电，供应家庭和工厂","氢燃料电池：利用氢气产生电","安全使用电器：手湿时不碰插座，不同时使用太多电器","防触电：不用湿手接触电器，不把金属插入插座","防短路和火灾：不使用破损电线，不让电线过载","节省用电：不用时关掉电器，选用省电电器"],[]],

U.forEach(u=>{if(u[1].length>6)u[3]=u[1].splice(6)});
const P="5v2";
const ls=(k,d)=>{try{return JSON.parse(localStorage[k]||d)}catch(e){return JSON.parse(d)}},ss=(k,v)=>{try{localStorage[k]=JSON.stringify(v)}catch(e){}};
let W=ls("w"+P,"[]");
const sv=()=>ss("w"+P,W);
let cur=0;
function pick(pool,key,n){let seen=ls("s"+P+key,"[]"),f=pool.filter(x=>!seen.includes(x.id));if(f.length<n){seen=[];f=pool}f=sh(f).slice(0,n);ss("s"+P+key,seen.concat(f.map(x=>x.id)));return f}
const LL=i=>U[i][1].concat(U[i][3]||[]),LN=i=>LL(i).map(x=>x.split("："));
function gen(i,l,t){const A=LN(i),p=A[l];let O=A.filter((_,k)=>k!=l);if(O.length<3)O=O.concat(U.flatMap((u,k)=>k==i?[]:LN(k)));O=sh(O);const id="g|"+i+"|"+l+"|"+t;
if(t==0)return{id,k:id,q:`“${p[1]}”是指？`,o:[p[0],O[0][0],O[1][0]]};
if(t==1)return{id,k:id,q:`“${p[0]}”的意思是？`,o:[p[1],O[0][1],O[1][1]]};
if(t==2)return{id,k:id,q:`判断：“${p[0]}”的意思是“${p[1]}”`,o:["正确","错误"]};
return{id,k:id,q:`判断：“${p[0]}”的意思是“${O[0][1]}”`,o:["错误","正确"]}}
function pool(i){const g=[];LL(i).forEach((_,l)=>[0,1,2,3].forEach(t=>g.push(gen(i,l,t))));return U[i][2].map((x,j)=>({id:"h|"+i+"|"+j,k:i+"|"+j,q:x[0],o:x[1]})).concat(g)}
function nav(){$("#nav").innerHTML=U.map((u,i)=>`<button class="${cur===i?"on":""}" onclick="go(${i})">${i+1}</button>`).join("")+`<button class="${cur==="h"?"on":""}" onclick="go('h')">🕵️</button><button class="${cur==="o"?"on":""}" onclick="go('o')">🔢</button><button class="${cur==="w"?"on":""}" onclick="go('w')">❌${W.length}</button>`}
function go(i){cur=i;nav();scrollTo(0,0);i==="h"?who():i==="o"?ord():i==="w"?wrong():unit(i)}
function quiz(items,box){const Q=items.map(x=>({...x,s:sh(x.o)}));
box.innerHTML=Q.map((x,i)=>`<div class="q"><b>${i+1}. ${x.q}</b>${x.s.map(o=>`<label><input type="radio" name="q${i}" value="${o}"> ${o}</label>`).join("")}<div class="fb"></div></div>`).join("")+`<button class="sub">提交</button><div class="sc"></div>`;
box.querySelector(".sub").onclick=function(){let s=0;Q.forEach((x,i)=>{const v=box.querySelector(`input[name=q${i}]:checked`),ok=v&&v.value===x.o[0],f=box.querySelectorAll(".fb")[i];if(ok)s++;f.className="fb "+(ok?"ok":"no");f.textContent=ok?"✅ 答对了":"❌ 正确答案："+x.o[0];if(x.k){W=W.filter(k=>k!==x.k);if(!ok)W.push(x.k)}});sv();nav();box.querySelector(".sc").textContent=`得分：${s} / ${Q.length}`;this.disabled=true}}
function unit(i){const u=U[i],pl=pool(i);let it=pick(pl,"u"+i,10);
if(false)for(let n=0;n<2;n++){const v=30+10*Math.floor(Math.random()*7),t=2+Math.floor(Math.random()*3);it.push({q:`一辆车${t}小时行驶${v*t}公里，速度是多少？`,o:[v+" 公里/小时",(v+10)+" 公里/小时",(v-10)+" 公里/小时"]})}
$("#main").innerHTML=`<div class="card"><h2>单元${i+1}：${u[0]}</h2><ul>${u[1].map(l=>{const p=l.split("：");return`<li><b>${p[0]}</b>：${p[1]}</li>`}).join("")}</ul></div><div class="card"><h2>📝 练习</h2><p class="fb">题库 ${pl.length} 题，每次随机抽 ${it.length} 题，尽量不重复</p><div id="qz"></div><button class="sub" onclick="unit(${i});scrollTo(0,document.querySelector('#qz').offsetTop-140)">🔄 换一批</button></div>`;quiz(it,$("#qz"))}
function wrong(){const it=W.map(k=>{if(k[0]=="g"){const[,a,b,c]=k.split("|");return gen(+a,+b,+c)}const[a,b]=k.split("|"),x=U[a][2][b];return{k,q:x[0],o:x[1]}});
$("#main").innerHTML=`<div class="card"><h2>❌ 错题本</h2><div id="qz">${it.length?"":"🎉 目前没有错题！"}</div></div>`;if(it.length)quiz(it,$("#qz"))}
function who(){const all=[];U.forEach((u,i)=>LL(i).forEach((_,l)=>[0,1].forEach(t=>all.push(gen(i,l,t)))));const it=pick(all,"who",10).map(x=>({id:x.id,q:x.q,o:x.o}));
$("#main").innerHTML=`<div class="card"><h2>🕵️ 猜猜我是谁</h2><p class="fb">题库 ${all.length} 题，每次随机抽 10 题，尽量不重复</p><div id="qz"></div><button class="sub" onclick="who()">🔄 换一批</button></div>`;quiz(it,$("#qz"))}
function ord(){const S=pick(ORD.map((s,i)=>({id:"o"+i,s})),"ord",1)[0].s,I=sh(S[1]);let sel=[],done=0;
const r=()=>{$("#main").innerHTML=`<div class="card"><h2>🔢 排排站</h2><p>${S[0]}：依次点击，由先到后；再点一次可取消。</p><div class="grid">${I.map((x,i)=>{const k=sel.indexOf(i);return`<div class="pc" data-i="${i}" style="cursor:pointer;${k>=0?"outline:3px solid var(--p)":""}">${x}${k>=0?`<b>（${k+1}）</b>`:""}</div>`}).join("")}</div><button class="sub" id="ok" ${done?"disabled":""}>提交</button> <button class="sub" onclick="ord()">换一题</button>${done?`<div class="sc">${sel.map(i=>I[i]).join("")==S[1].join("")?"✅ 全对！":"❌ 正确顺序："+S[1].join(" → ")}</div>`:""}<p class="fb">题库 ${ORD.length} 题</p></div>`;
$(".grid").onclick=e=>{const c=e.target.closest(".pc");if(!c||done)return;const i=+c.dataset.i,k=sel.indexOf(i);k>=0?sel.splice(k,1):sel.push(i);r()};
$("#ok").onclick=()=>{if(sel.length<I.length)return;done=1;r()}};r()}
go(0);
</script></body></html>
